[workspace]
members = ["core", "python-native"]
resolver = "2"

[workspace.package]
version = "0.4.6"
edition = "2021"
rust-version = "1.90"
license = "LicenseRef-Proprietary"

[workspace.dependencies]
aws-lc-rs = "=1.18.1"
zeroize = { version = "=1.9.0", features = ["derive"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
base64 = "=0.22.1"
pyo3 = { version = "=0.29.2", features = ["extension-module"] }

[profile.release]
panic = "unwind"
